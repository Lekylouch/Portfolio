<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Preuve – Sylvestre Ibara</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }

    .md h1 {
      font-size: 1.6rem !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      margin-bottom: 1.5rem !important;
      line-height: 1.3 !important;
      border-bottom: 3px solid #f97316;
      padding-bottom: 0.75rem;
    }
    .md h2 {
      font-size: 1rem !important;
      font-weight: 700 !important;
      color: #f97316 !important;
      margin-top: 2rem !important;
      margin-bottom: 0.75rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.08em !important;
    }
    .md h3 {
      font-size: 0.95rem !important;
      font-weight: 600 !important;
      color: #334155 !important;
      margin-top: 1.25rem !important;
      margin-bottom: 0.5rem !important;
    }
    .md p {
      color: #475569 !important;
      line-height: 1.8 !important;
      margin-bottom: 0.85rem !important;
      font-size: 0.9rem !important;
    }
    .md ul {
      margin: 0.5rem 0 1rem 0 !important;
      padding: 0 !important;
      list-style: none !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 0.4rem !important;
    }
    .md ul li {
      color: #475569 !important;
      font-size: 0.875rem !important;
      padding: 0.5rem 0.85rem !important;
      background: #f8fafc !important;
      border-left: 3px solid #f97316 !important;
      border-radius: 0 0.375rem 0.375rem 0 !important;
      list-style: none !important;
    }
    .md strong {
      color: #0f172a !important;
      font-weight: 600 !important;
    }
    .md code {
      background: #f1f5f9 !important;
      color: #0f172a !important;
      padding: 0.1rem 0.4rem !important;
      border-radius: 0.25rem !important;
      font-size: 0.8rem !important;
      font-family: monospace !important;
    }
    .md pre {
      background: #0f172a !important;
      color: #e2e8f0 !important;
      padding: 1rem !important;
      border-radius: 0.75rem !important;
      overflow-x: auto !important;
      font-size: 0.8rem !important;
      margin: 1rem 0 !important;
    }
    .md pre code {
      background: none !important;
      color: inherit !important;
      padding: 0 !important;
    }
    .md img {
      height: 200px !important;
      width: 100% !important;
      object-fit: cover !important;
      border-radius: 0.75rem !important;
      border: 1px solid #e2e8f0 !important;
      margin: 1rem 0 !important;
      cursor: zoom-in !important;
      transition: opacity 0.2s !important;
    }
    .md img:hover {
      opacity: 0.85 !important;
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open {
      display: flex;
    }
    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 0.75rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      object-fit: contain;
    }
    .md blockquote {
      border-left: 4px solid #e2e8f0 !important;
      padding: 0.5rem 1rem !important;
      color: #94a3b8 !important;
      font-style: italic !important;
      margin: 0.75rem 0 !important;
      background: #f8fafc !important;
      border-radius: 0 0.5rem 0.5rem 0 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-orange-200 min-h-screen">

  <!-- Lightbox -->
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="" />
  </div>

  <div class="max-w-3xl mx-auto px-4 py-12">

    <div class="mb-8">
      <a href="butgeii.html"
         class="inline-flex items-center gap-2 text-sm font-medium text-slate-500 hover:text-orange-500 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Retour à la cartographie
      </a>
    </div>

    <div id="loading" class="text-center py-24 text-slate-400 text-sm">Chargement…</div>

    <div id="error" class="hidden text-center py-24">
      <p class="text-slate-500 text-sm">Fichier introuvable ou non encore rédigé.</p>
      <a href="butgeii.html" class="mt-4 inline-block text-orange-500 text-sm font-medium hover:underline">← Retour</a>
    </div>

    <article id="content" class="hidden md bg-white rounded-2xl border border-slate-200 shadow-sm p-8 md:p-10">
    </article>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ac = params.get('ac');

    async function loadContent() {
      if (!ac) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(`preuves/${ac}.md`);
        if (!res.ok) throw new Error('not found');
        const md = await res.text();

        document.title = ac.toUpperCase() + ' – Sylvestre Ibara';

        const html = await Promise.resolve(marked.parse(md));

        document.getElementById('loading').classList.add('hidden');
        const content = document.getElementById('content');
        content.classList.remove('hidden');
        content.innerHTML = html;
      } catch (e) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
      }
    }

    loadContent();

    function openLightbox(src, alt) {
      const lb = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-img').alt = alt;
      lb.classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    // Attache le clic sur chaque image après le chargement du MD
    document.getElementById('content').addEventListener('click', e => {
      if (e.target.tagName === 'IMG') {
        openLightbox(e.target.src, e.target.alt);
      }
    });
  </script>

</body>
</html>
